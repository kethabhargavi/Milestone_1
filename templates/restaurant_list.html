<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoodExpress - Restaurant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/restaurant.css">
 
</head>
<body>
<nav class="navbar">
  <div class="logo">Food<span>Express</span></div>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/menu">Menu</a></li>
    <li><a href="/tracking" class="active">orders</a></li>
    <li><a href="/profile">Profile</a></li>
  </ul>
</nav>

<section class="restaurant-hero">
  <img src="https://picsum.photos/800/250?random=10" alt="Restaurant Banner">
  <h1>Pizza Paradise</h1>
  <p>Italian • ⭐ 4.8 • 30 mins delivery</p>
</section>

<section class="restaurant-menu">
  <h2>Menu</h2>
  <div class="menu-grid" id="restaurant-menu">
    <!-- Menu items dynamically -->
  </div>
</section>

<script src="/static/js/menu.js"></script>
<script>
const menuDiv = document.getElementById("restaurant-menu");
const restaurantMenu = [
    {name:'Chicken Biryani', price:250, image:'chicken.jpg'},
    {name:'Mutton Curry', price:280, image:'mutton_curry.jpg'},
    {name:'Panneer Biryani', price:100, image:'panneer.jpg'}
];

restaurantMenu.forEach(item=>{
    const div = document.createElement("div");
    div.className = "menu-card";
    div.innerHTML = `
        <img src="${item.image}" alt="${item.name}">
        <h3>${item.name}</h3>
        <p>₹${item.price}</p>
        <div class="quantity-selector">
          <button onclick="decreaseQty(this)">-</button>
          <span>1</span>
          <button onclick="increaseQty(this)">+</button>
        </div>
        <button onclick="addToCart('${item.name}',${item.price},'${item.image}')">Add to Cart</button>
    `;
    menuDiv.appendChild(div);
});
</script>
</body>
</html>
